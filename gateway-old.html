<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollUp - El Nuevo Tinder de los Viajes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    
    <!-- Google AdSense Auto Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5905369775862039" crossorigin="anonymous"></script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://collup.info/">
</head>
<body>
    <div class="split-gateway">
        <div class="split-header">
            <!-- Selector de idiomas integrado en el header -->
            <div class="lang-toggle-container">
                <div class="lang-selector">
                    <button class="lang-btn active" id="btn-es" onclick="setLanguage('es')">🇪🇸 ES</button>
                    <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">🇬🇧 EN</button>
                </div>
            </div>
            <img src="assets/logo.png" alt="CollUp Logo">
            <p data-i18n="gateway_subtitle">El Nuevo Tinder de los Viajes</p>
        </div>

        <a href="influencer.html" class="split-half influencer-side">
            <div class="split-content">
                <i data-lucide="camera" class="icon-cyan" style="width:64px; height:64px; margin-bottom: 20px;"></i>
                <h2 data-i18n="gateway_creator_title">Soy Creador</h2>
                <p data-i18n="gateway_creator_desc">Viaja y monetiza tu contenido conectando directamente con las mejores marcas.</p>
                <div class="btn btn-primary" style="width:auto; padding: 12px 30px; display:inline-block;"><span data-i18n="gateway_enter">Entrar</span> <i data-lucide="arrow-right" style="vertical-align: middle; width: 18px; height:18px;"></i></div>
            </div>
        </a>

        <a href="business.html" class="split-half business-side">
            <div class="split-content">
                <i data-lucide="building-2" class="icon-blue" style="width:64px; height:64px; margin-bottom: 20px;"></i>
                <h2 data-i18n="gateway_business_title">Soy Negocio</h2>
                <p data-i18n="gateway_business_desc">Aumenta tu visibilidad colaborando con perfiles verificados sin pagar a agencias.</p>
                <div class="btn btn-secondary" style="width:auto; padding: 12px 30px; display:inline-block;"><span data-i18n="gateway_enter">Entrar</span> <i data-lucide="arrow-right" style="vertical-align: middle; width: 18px; height:18px;"></i></div>
            </div>
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
